[project]
name = "mobarchy-agent"
version = "0.1.0"
description = "Mobarchy agent runtime: operates the phone through its MCP tool layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic[mcp]>=1.9,<2",
    "mcp>=2.2,<3",
    # Frigg (talk.py): Silero VAD and Piper voices run on onnxruntime
    "onnxruntime>=1.20,<2",
    "numpy>=2",
    "piper-tts>=1.8,<2",
    "websockets>=14,<16",
]

[project.scripts]
mobarchy-agent = "mobarchy_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobarchy_agent"]
