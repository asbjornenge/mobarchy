[project]
name = "mobarchy-mcp"
version = "0.1.0"
description = "Mobarchy OS tool layer: the phone exposed as MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "icalendar>=7.3.0",
    "mcp>=2.2,<3",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
mobarchy-mcp = "mobarchy_mcp.server:main"
mobarchy-mcp-call = "mobarchy_mcp.client:main"
mobarchy-store = "mobarchy_mcp.store:main"
mobarchy-webapp = "mobarchy_mcp.webapps:main"
mobarchy-accounts = "mobarchy_mcp.accounts:main"
mobarchy-calendar = "mobarchy_mcp.calendars:main"
mobarchy-mail = "mobarchy_mcp.mail:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobarchy_mcp"]
