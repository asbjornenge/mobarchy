# Google Pixel 9 Pro Fold. Primary hardware target.
# Status: boots Mobarchy natively (v0.2, see README.md).

[device]
codename = "comet"
name = "Google Pixel 9 Pro Fold"
arch = "aarch64"
kind = "hardware"
soc = "Google Tensor G4 (zumapro)"
gpu = "Mali-G715"
memory = "16G"
boot = "native"     # own gs-6.1 kernel build + Arch Linux ARM rootfs on userdata (ADR 0007)
baseline = "lineageos-23.2"

[[display]]
id = "outer"
connector = "DSI-2"
width = 1080
height = 2424
top_inset = 32      # camera cutout
rotation_locked = true  # the outer panel stays upright until the owner unlocks it (ADR 0020)

[[display]]
id = "inner"
connector = "DSI-1"
width = 2152
height = 2076
top_inset = 24      # camera cutout
side_inset = 20     # trial value: the clock was cut off at the left edge

[input]
touch = "vendor"
fold_sensor = true

# Haptics (the cs40l26 actuator, a force-feedback input device): the click the shell plays
# on buttons, a custom effect from the firmware's wavetable: bank (0: RAM) and index (2: the
# click, as Pixel's vibrator HAL plays it)
# Rotation (ADR 0020): the fold script turns the panel in use, and its touch
[rotation]
hook = "/usr/lib/mobarchy/fold rotate"

[haptics]
click_bank = 0
click_index = 2

# The Android container for telephony (ADR 0014; os/rootfs/usr/lib/mobarchy/android-container).
[android]
partitions = ["system", "system_ext", "product", "vendor"]   # from super, read-only
init = "/usr/share/mobarchy/android/comet.rc"
# writes comet's adaptations of vendor files (thermal, display and OpenCL configuration)
overlay_hook = "/usr/lib/mobarchy/android-overlay"
# cpif's switch that crashes the modem on purpose: never writable from the container
masked_sysfs = ["/sys/devices/platform/cpif/do_cp_crash"]

# Android properties for the container (its odm build.prop)
[android.properties]
# GLES from Mesa (os/android-mesa), not Mali's driver, which needs Mali's kernel driver (ADR 0017)
"ro.hardware.egl" = "mesa"

# /var/lib/mobarchy/android/vendor/<name> -> /mnt/vendor/<name>. These hold the modem's
# NV data (efs, efs_backup) and calibration (persist): for now copies, never the real
# partitions (see ADR 0014).
[android.vendor_dirs]
efs = "rw"
efs_backup = "rw"
modem_userdata = "rw"
persist = "rw"

# <name> = partition: mounted read-only at /mnt/vendor/<name>, through a read-only loop
[android.vendor_images]
modem_img = "modem"

# device nodes recreated in the container: mode, owner, group (vendor ueventd.rc)
[android.devices]
"/dev/umts_boot0" = ["0660", "radio", "system"]
"/dev/umts_ipc0" = ["0660", "radio", "radio"]
"/dev/umts_ipc1" = ["0660", "radio", "radio"]
"/dev/umts_rfs0" = ["0660", "radio", "radio"]
"/dev/umts_router" = ["0660", "system", "system"]
"/dev/umts_dm0" = ["0660", "system", "system"]
"/dev/oem_ipc*" = ["0660", "radio", "radio"]
"/dev/oem_test" = ["0660", "radio", "radio"]

# the cameras (LWIS: sensors, OIS, flash, the ISP blocks), and what the camera HAL works
# with: the GXP and TPU, and the DMA-BUF heaps for buffers
"/dev/lwis-*" = ["0660", "system", "system"]
"/dev/gxp" = ["0666", "system", "camera"]
"/dev/edgetpu-soc" = ["0660", "system", "system"]
"/dev/edgetpu-limited" = ["0660", "system", "system"]
"/dev/dma_heap/*" = ["0444", "system", "system"]
# the hardware codecs (video, and JPEG for photos): Samsung's MFC and Google's BigWave
"/dev/video[6-9]" = ["0660", "mediacodec", "mediadrm"]
"/dev/video1[01]" = ["0660", "mediacodec", "mediadrm"]
"/dev/video12" = ["0666", "system", "system"]
"/dev/bigwave" = ["0660", "mediacodec", "mediadrm"]
# the sensors (USF, on the AOC): the camera HAL reads the gyro (stabilisation) through them
"/dev/acd-com.google.usf" = ["0660", "system", "system"]
"/dev/acd-com.google.usf.non_wake_up" = ["0660", "system", "system"]
# the AOC itself: the sensor HAL maps direct channels' buffers (the gyro the camera HAL
# reads at its own rate) into it
"/dev/aoc" = ["0660", "system", "system"]
