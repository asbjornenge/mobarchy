# Mobarchy debug initramfs settings for comet (Pixel 9 Pro Fold). Sourced by os/initramfs/init.
# The vendor_kernel_boot ramdisk provides /lib/modules (with modules.load), since the
# bootloader concatenates the vendor ramdisks with ours.
USB_PRODUCT_NAME="Mobarchy debug (comet)"
USB_UDC=11210000.dwc3

# Like Android's init.recovery.comet.rc: the Exynos DWC3 glue only starts a device-mode
# session once B-session valid is set.
usb_post_bind() {
    echo 1 > /sys/devices/platform/11210000.usb/dwc3_exynos_otg_b_sess
}
DIAG_TIMEOUT=60

# The bootloader leaves the Exynos watchdog armed (boots reset ~20 s after the kernel
# starts unless it is serviced). Load its driver and dependencies first, then pet it.
PRELOAD_MODULES="dss.ko pixel-suspend-diag.ko exynos-pmu-if.ko exynos-pd_el3.ko s3c2410_wdt.ko"
WATCHDOG=1

# Show the debug log on the panels (exynos-drm gets its panel names from the kernel
# command line). The lockup detectors stay out of the debug initramfs.
SCREENLOG=1
SCREENLOG_SCALE=2
MODULE_SKIP="hardlockup-watchdog ehld"
