# comet (Pixel 9 Pro Fold): touch-to-panel mapping and fold handling.
# DSI-1 = inner panel (google-ct3b, 2152x2076, Goodix touch)
# DSI-2 = outer panel (google-ct3d, 1080x2424, Synaptics touch)

device {
    name = goodix_ts0-1
    output = DSI-1
    # The inner panel is rotated (transform 1 in the fold script), but its touch
    # controller already reports in the upright frame: don't rotate touch again.
    transform = 0
}

device {
    name = synaptics_tcm_touch-1
    output = DSI-2
}

# Which panel is on: written by the fold script (empty until it first runs).
source = /run/mobarchy/fold.conf

bindl = , switch:on:hall effect sensor, exec, /usr/lib/mobarchy/fold folded
bindl = , switch:off:hall effect sensor, exec, /usr/lib/mobarchy/fold unfolded
exec-once = /usr/lib/mobarchy/fold auto
