# Tap to wake (kernel/patches/private/google-modules/touch).
# Nothing on Mobarchy takes the touch bus on the AoC side; keep it with the AP. Otherwise every
# screen on/off waits ~2.5 s for AoC, and the controller's wake gestures are dropped.
options goog_touch_interface tbn=0
# A single tap on the dark screen reports KEY_WAKEUP (outer: synaptics, inner: goodix).
options syna_touch wake_gesture=1
options goodix_brl_touch wake_gesture=1
