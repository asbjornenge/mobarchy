# The cameras as webcams (/usr/lib/mobarchy/webcam): one v4l2loopback device for each of
# the camera bridge's cameras (mobarchy-camera-0: back, -1: front). exclusive_caps: a
# capture device to readers (browsers skip devices that are capture and output both).
options v4l2loopback devices=2 video_nr=20,21 exclusive_caps=1 max_buffers=4 card_label="Back camera,Front camera"
