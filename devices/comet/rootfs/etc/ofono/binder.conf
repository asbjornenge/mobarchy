# oFono's binder plugin on comet (ADR 0014): rild in the Android container serves the AIDL
# radio HAL (android.hardware.radio.*/slotN) on the container's /dev/binder, which
# android-container shares with the host as /dev/binder.
[Settings]
Device=/dev/binder
InterfaceType=aidl
Identity=radio:radio
# slot1: the SIM card; slot2: the eSIM
ExpectSlots=slot1,slot2

[slot1]
path=/ril_0
slot=0

[slot2]
path=/ril_1
slot=1
