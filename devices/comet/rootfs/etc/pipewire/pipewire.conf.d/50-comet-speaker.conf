# comet: the speakers, as one stereo sink on AoC's primary playback endpoint (EP2, hw:0,1;
# mobarchy-audio.service routes it to both amps). Left = top speaker, right = bottom.
# ALSA's card profiles can't describe the AoC card (no UCM), so the sink is declared here.
#
# AoC waits until its ring holds a threshold of data and then takes it all at once: the
# stream must start before the ALSA buffer is full, or the position looks stuck and ALSA
# gives up after 100 ms. Small periods and no mmap keep PipeWire on the safe side.
context.objects = [
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "comet-speaker"
            node.description       = "Speaker"
            media.class            = "Audio/Sink"
            api.alsa.path          = "hw:0,1"
            api.alsa.period-size   = 480
            api.alsa.period-num    = 8
            api.alsa.headroom      = 0
            api.alsa.disable-mmap  = true
            audio.format           = "S16LE"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            priority.driver        = 2000
            priority.session       = 2000
        }
    }
]
