# comet: the AoC card's automatic ALSA profiles don't work (see
# /etc/pipewire/pipewire.conf.d/50-comet-audio.conf for the sink that does).
monitor.alsa.rules = [
    {   matches = [ { device.name = "~alsa_card.platform-sound-aoc*" } ]
        actions = { update-props = { device.disabled = true } }
    }
]
