<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Mobarchy's app icons: a Tokyo Night tile, a line glyph in the accent gradient -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="#1a1b26" stroke="#292e42" stroke-width="3"/>
  <!-- a globe: the web -->
  <g fill="none" stroke="url(#g)" stroke-width="6.5" stroke-linecap="round">
    <circle cx="64" cy="64" r="34"/>
    <ellipse cx="64" cy="64" rx="15" ry="34"/>
    <path d="M32 54 h64 M32 74 h64"/>
  </g>
  <circle cx="96" cy="96" r="9" fill="#9ece6a" stroke="#1a1b26" stroke-width="4"/>
