# Mobarchy default Hyprland config (prototype shell).
# Shared by every device. Device-specific monitor rules come from
# ~/.config/hypr/device.conf, which the device layer generates.

source = ~/.config/hypr/device.conf
source = /etc/mobarchy/hyprland-device.conf

env = XCURSOR_SIZE,24

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

# Phone-style: one app per screen. Every new window opens on its own (empty) workspace,
# so it always fills the screen, whatever tiling or reloads do; the bar switches to the
# most recent window when one closes. maximize also lets single windows ignore gaps.
windowrule = match:class .*, workspace empty
windowrule = match:class .*, maximize on
decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    # No blur: it is worked out again for every frame drawn over it (the app switcher blurs
    # a picture of the screen itself, once).
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    # Phone-style windows: a new window takes over the maximized state (instead of
    # tiling next to the old one), and closing one keeps the next maximized.
    on_focus_under_fullscreen = 1
    exit_window_retains_fullscreen = true
    # An app that asks to be shown gets the screen: a link opening in the running browser
    # (a login page from the agent) brings it to the front.
    focus_on_activate = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

cursor {
    no_hardware_cursors = true
    hide_on_touch = true
    inactive_timeout = 1
}

input {
    kb_layout = us
    touchdevice {
        enabled = true
    }
}

$terminal = foot
bind = SUPER, Return, exec, $terminal
bind = SUPER, Q, killactive
# ⌘+Tab (Super+Tab): the open apps, one chosen at a time while ⌘ is held (⇧ goes back); ⌘
# let go goes to it, Escape doesn't (the shell's switcher, org.mobarchy.Switcher: it has the
# keyboard meanwhile, and sees ⌘ let go itself)
$switcher = busctl --user call org.mobarchy.Shell /org/mobarchy/Switcher org.mobarchy.Switcher
bind = SUPER, Tab, exec, $switcher Next
bind = SUPER SHIFT, Tab, exec, $switcher Previous
# ⌘+← / ⌘+→ (Super): the notifications to the left of what is open (the app, or home's
# widgets), the apps to the right (the shell's org.mobarchy.Home). (Not Alt or Ctrl: apps go
# back and forward, and move by word, with those; none uses Super.)
$home = busctl --user call org.mobarchy.Shell /org/mobarchy/Home org.mobarchy.Home
bind = SUPER, Left, exec, $home Left
bind = SUPER, Right, exec, $home Right
# ⌘+H: home, its widgets
bind = SUPER, H, exec, $home Home
# Alt+Space (Option+Space on a Mac keyboard): the emoji, searched from a hardware keyboard
# (the shell's EmojiPicker borrows its keys from the focused field)
bind = ALT, space, exec, busctl --user call org.mobarchy.Shell /org/mobarchy/Keyboard org.mobarchy.Keyboard emojiSearch

# Hand the session environment to the systemd user manager, then (re)start the Mobarchy
# services. restart, not start: the user manager outlives a compositor restart, and a
# service still running from the previous session would talk to a dead instance.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP && systemctl --user restart mobarchy-keyring mobarchy-mcp mobarchy-shell

# No update-news or donation dialogs: the image decides the Hyprland version.
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# Hardware keyboards' layout, as the agent sets it (mobarchy-mcp's set_keyboard_layout;
# layouts of the owner's own in ~/.config/xkb/symbols). The image starts it empty.
source = ~/.config/hypr/keyboard.conf

# The owner's own settings: last, so they win. Mobarchy's config doesn't touch the file;
# the image starts it empty.
source = ~/.config/hypr/local.conf
