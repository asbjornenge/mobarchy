# Mobarchy default Hyprland config (prototype shell).
# Shared by every device. Device-specific monitor rules come from
# ~/.config/hypr/device.conf, which the device layer generates.

source = ~/.config/hypr/device.conf

env = XCURSOR_SIZE,24

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

# Phone-style: every app window fills the screen, and focus decides which one is on top.
windowrule = match:class .*, maximize on

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

cursor {
    no_hardware_cursors = true
    hide_on_touch = true
    inactive_timeout = 1
}

input {
    kb_layout = us
    touchdevice {
        enabled = true
    }
}

$terminal = foot
bind = SUPER, Return, exec, $terminal
bind = SUPER, Q, killactive
bind = SUPER, Tab, cyclenext

# Hand the session environment to the systemd user manager, then start the Mobarchy services.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP && systemctl --user start mobarchy-mcp mobarchy-bar
exec-once = squeekboard
exec-once = $terminal
