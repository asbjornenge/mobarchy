# Mobarchy: GeoClue's location from the phone's own GNSS (mobarchy-location), and indoors,
# where the GNSS hears no satellites, from the Wi-Fi networks around, looked up in BeaconDB
# (open, non-profit; told the networks around, not who asks). No IP lookups.
[network-nmea]
enable=true
nmea-socket=/run/mobarchy-location/nmea.sock

[ip]
enable=false

[wifi]
enable=true
url=https://api.beacondb.net/v1/geolocate
submit-data=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

# The shell is the agent: it decides which apps may know where the phone is (GeoClue answers
# no one while there is no agent)
[agent]
whitelist=org.mobarchy.Shell

# The shell (its weather, and asking the owner for other apps later)
[org.mobarchy.Shell]
allowed=true
system=true
users=
