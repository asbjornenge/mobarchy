# Mobarchy: GeoClue's location from the phone's own GNSS (mobarchy-location), and nothing
# sent elsewhere to find it (no IP or Wi-Fi lookups, which tell a server where the owner is).
[network-nmea]
enable=true
nmea-socket=/run/mobarchy-location/nmea.sock

[ip]
enable=false

[wifi]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

# The shell is the agent: it decides which apps may know where the phone is (GeoClue answers
# no one while there is no agent)
[agent]
whitelist=org.mobarchy.Shell

# The shell (its weather, and asking the owner for other apps later)
[org.mobarchy.Shell]
allowed=true
system=true
users=
