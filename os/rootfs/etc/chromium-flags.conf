# Chromium on a phone (read by Arch's /usr/bin/chromium; ~/.config/chromium-flags.conf adds to it).
# Mobarchy is Wayland only (Chromium would try X11 first).
--ozone-platform=wayland
# Sites get their mobile layout: a "Mobile" user agent, <meta name=viewport> honoured, touch events.
--use-mobile-user-agent
--enable-viewport
--touch-events=enabled
# Larger tabs and toolbar buttons for fingers.
--top-chrome-touch-ui=enabled
