# libgbinder (oFono's binder plugin) and the Android container's binder devices, which
# android-container links as the host's /dev/binder and /dev/vndbinder (ADR 0014).
# Android 16 and 17 (API 36, 37): the aidl3 wire protocol and the aidl6 service manager.
[Protocol]
/dev/binder = aidl3
/dev/vndbinder = aidl3

[ServiceManager]
/dev/binder = aidl6
/dev/vndbinder = aidl6
