# Spotify (mobarchy-spotify, ADR 0042): librespot's PulseAudio output asks for small buffers,
# and on comet's speaker that stuttered, as Android's did (50-mobarchy-waydroid.conf). Its
# stream gets at least 2048 frames (43 ms): music, not a call.
pulse.rules = [
    {
        matches = [ { application.name = "mobarchy-spotify" } { application.process.binary = "mobarchy-spotify" } ]
        actions = {
            update-props = {
                pulse.min.req = 2048/48000
                pulse.min.quantum = 2048/48000
            }
        }
    }
]
