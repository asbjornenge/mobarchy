# Android's sound (Waydroid, ADR 0029): its audio HAL asks PipeWire for 256-frame buffers
# (5 ms), and in that rhythm Android's mixer can't keep up and the speaker underruns: the
# sound crackles. Android's stream gets at least 1024 frames (21 ms); that is latency an
# app's video or music doesn't notice.
pulse.rules = [
    {
        matches = [ { application.name = "Waydroid" } ]
        actions = {
            update-props = {
                pulse.min.req = 1024/48000
                pulse.min.quantum = 1024/48000
            }
        }
    }
]
