# Frigg's microphone and voice (ADR 0026): an echo canceller (WebRTC) between the default
# microphone and speaker, so Frigg doesn't hear itself and can be talked over. Frigg records
# from mobarchy-echo-cancel-source and speaks into mobarchy-echo-cancel-sink; everything
# else uses the devices as before.
# - passive: the microphone isn't opened for it while nothing records from it;
# - low session priority: never the default source or sink.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            capture.props = {
                node.name    = "mobarchy-echo-cancel-capture"
                node.passive = true
            }
            source.props = {
                node.name        = "mobarchy-echo-cancel-source"
                node.description = "Microphone for Frigg (echo cancelled)"
                priority.session = 100
            }
            sink.props = {
                node.name        = "mobarchy-echo-cancel-sink"
                node.description = "Frigg's voice (echo cancelled)"
                priority.session = 100
            }
            playback.props = {
                node.name    = "mobarchy-echo-cancel-playback"
                node.passive = true
            }
        }
    }
]
