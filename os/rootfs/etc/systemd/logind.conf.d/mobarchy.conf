# Phones: a fold/hall sensor shows up as a lid switch, and the power key is ours to
# handle. Until Mobarchy has proper suspend support, logind must not act on either.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandleSuspendKey=ignore
IdleAction=ignore
