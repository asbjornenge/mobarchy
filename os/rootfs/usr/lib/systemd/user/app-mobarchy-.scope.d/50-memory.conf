# Every app the phone starts (app-mobarchy-<app>-<n>.scope: the shell, mobarchy-open, the
# agent) gets a share of the memory, no more (ADR 0027). An app that runs away is killed by
# the kernel when it reaches it, alone and at once, instead of the whole phone thrashing
# for minutes until the kernel's last resort picks something (with no swap, a phone has
# nothing to page out but code).
[Scope]
MemoryMax=30%
