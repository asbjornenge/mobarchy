# The apps (ADR 0035). When the phone has been short of memory for a while (half the time
# stalled on it, over oomd's 10 s), systemd-oomd kills the app that is causing it, before
# the phone freezes. The shell and the agent are in session.slice, out of reach.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
