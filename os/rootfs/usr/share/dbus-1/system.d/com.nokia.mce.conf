<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- mobarchy-mce (ADR 0043): MCE's display, charger and battery state, for oFono -->
<busconfig>
  <policy user="root">
    <allow own="com.nokia.mce"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.nokia.mce" send_interface="com.nokia.mce.request"/>
    <allow send_destination="com.nokia.mce" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
