<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Mobarchy's app icons: a line glyph in the accent gradient, no tile -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64) scale(1.3) translate(-64 -64)">
    <!-- a picture: photos -->
    <g fill="none" stroke="url(#g)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="28" y="34" width="72" height="60" rx="10"/>
      <path d="M30 86 l22 -22 l16 16 l10 -10 l20 20"/>
    </g>
    <circle cx="80" cy="54" r="7" fill="#e0af68"/>
  </g>
