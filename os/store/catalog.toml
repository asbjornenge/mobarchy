# Apps known to work on Mobarchy (ADR 0012). Packages get their name, summary, description,
# icon and screenshots from AppStream; web apps carry their own. `tested` lists device
# codenames.
#
#   [[app]]
#   id = "amberol"            unique, stable
#   kind = "package"          package | webapp
#   package = "amberol"       (package) the pacman package
#   url = "https://..."       (webapp) the start page
#   name, summary, icon       (webapp, or to override AppStream)
#   category = "music"        music, video, communication, internet, reading, photos,
#                             maps, productivity, utilities
#   tested = ["comet"]
#   note = "..."              shown with the app: what works, what doesn't

# --- music & audio ---------------------------------------------------------------------
[[app]]
id = "spotify"
kind = "webapp"
name = "Spotify"
summary = "Music and podcasts (the web player; playback needs Premium)"
url = "https://open.spotify.com"
category = "music"
tested = ["comet"]

[[app]]
id = "amberol"
kind = "package"
package = "amberol"
category = "music"
tested = ["comet"]

